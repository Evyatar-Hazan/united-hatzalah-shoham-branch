name: Deploy to Cloudflare

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SESSION_SECRET_CONFIGURED: ${{ vars.SESSION_SECRET_CONFIGURED }}
    steps:
      - name: Verify deploy configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is not configured." && exit 1)
          test "$SESSION_SECRET_CONFIGURED" = "true" || (echo "Cloudflare Pages SESSION_SECRET is not verified." && exit 1)

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare app
        run: npm run build:cloudflare

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply united-hatzalah-shoham-branch --remote

      - name: Deploy Pages
        run: npx wrangler pages deploy apps/client/dist --project-name united-hatzalah-shoham-branch --branch main
